<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>No Mercy — a 168-card card game</title>
    <!-- Fonts are self-hosted in styles.css. No CDN: tracker blockers such as
         DuckDuckGo's block fonts.googleapis.com, and the page should not look
         different depending on the browser's privacy settings. -->
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <!-- Two layers: the HUD persists during play, panels sit on top of it.
           They must be separate nodes - a panel clearing its own container
           previously wiped the HUD along with it. -->
      <div id="hud-layer"></div>
      <div id="screen-layer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
