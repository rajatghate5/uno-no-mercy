# Local run that mirrors a real deployment: one container serving both the
# game server and the built client.
#
#   docker compose up -d   ->   http://localhost:4040
services:
  uno:
    container_name: uno-no-mercy
    build: .
    restart: unless-stopped
    environment:
      PORT: 4040
      # Bot think-time in ms. Lower feels snappier, higher is easier to follow.
      UNO_BOT_DELAY_MS: 700
    ports:
      - "4040:4040"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:4040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
