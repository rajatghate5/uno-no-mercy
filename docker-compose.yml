# Local LAN server, mirroring how this would run on a host like Render.
#
# Start it with:   docker compose up -d
# Then players on the same network connect with:
#   UNO_SERVER=ws://<this-machine-ip>:4040 bun run play
services:
  uno-server:
    container_name: uno-server
    build: .
    restart: unless-stopped
    environment:
      PORT: 4040
      # Bot think-time in ms. Lower feels snappier, higher is easier to follow.
      UNO_BOT_DELAY_MS: 700
    ports:
      # Bound to all interfaces so other machines on the LAN can reach it.
      - "4040:4040"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:4040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
