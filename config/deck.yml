# ============================================================================
# UNO Show 'Em No Mercy — deck composition
# ============================================================================
# The engine reads this and refuses to boot unless the counts sum to `total`.
#
# Verified against open-mercy.com's full 168-card breakdown. Its stated
# subtotals contain two typos ("38 per colour" for a list of 37, "16 wilds"
# for a list of 20), but the ITEMS it lists sum to exactly 168 and agree with
# its own per-category totals (76 numbers, 72 coloured actions).
#
# 37 per colour x 4 = 148, plus 20 wilds = 168.
# ============================================================================

total: 168

colors: [red, yellow, green, blue]

# How many of each card, PER COLOUR. Multiplied by 4 colours.
perColor:
  # 0 is deliberately rarer than the other ranks - one per colour, not two.
  # It is the card that makes everyone pass their whole hand along.
  zero: 1
  # Copies of EACH rank 1-9, so 9 x 2 = 18 cards.
  numbers: 2

  drawTwo: 3
  skip: 3
  reverse: 3
  # The COLOURED +4. Distinct from Wild Reverse Draw 4 below.
  drawFour: 3
  skipEveryone: 3
  discardAll: 3
  # per-colour subtotal: 1 + 18 + 3 + 3 + 3 + 3 + 3 + 3 = 37
  # x 4 colours = 148

# Wild cards, not tied to a colour. 5 types x 4 = 20.
#
# NOTE: there is no plain "Wild Draw 4" in No Mercy. The deck has a coloured
# +4 in each suit (above) and a Wild Reverse Draw 4 — but no colourless plain
# +4. An earlier version of this file invented four of them.
wilds:
  wild: 4
  wildDrawSix: 4
  wildDrawTen: 4
  wildReverseDrawFour: 4
  wildColorRoulette: 4
  # subtotal: 20
